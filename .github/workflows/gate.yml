name: agent gate

on:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Re-run recorded failures against the live model
        run: python scripts/gate.py regressions/* --provider gemini --trials 10 --max-failure-rate 0.0
