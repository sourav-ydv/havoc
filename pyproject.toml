[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "havoc"
version = "0.0.1"
description = "Fault injection and failure shrinking for MCP-based agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["havoc"]
